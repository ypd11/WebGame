<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64" shape-rendering="crispEdges">
<defs>
  <g id="hair"><rect x="11" y="4" width="10" height="2" fill="#211b24"/><rect x="9" y="6" width="14" height="5" fill="#38252a"/><rect x="10" y="6" width="11" height="3" fill="#704238"/><rect x="12" y="5" width="6" height="2" fill="#95604a"/><rect x="9" y="9" width="3" height="3" fill="#49302c"/><rect x="20" y="8" width="3" height="4" fill="#49302c"/></g>
  <g id="body"><rect x="10" y="13" width="12" height="9" fill="#542d32"/><rect x="11" y="13" width="10" height="7" fill="#9b4246"/><rect x="12" y="14" width="8" height="4" fill="#bd5b53"/><rect x="14" y="18" width="4" height="2" fill="#d99b49"/><rect x="15" y="18" width="2" height="2" fill="#f1ca69"/><rect x="11" y="21" width="4" height="5" fill="#403039"/><rect x="17" y="21" width="4" height="5" fill="#403039"/><rect x="10" y="25" width="5" height="3" fill="#53362b"/><rect x="17" y="25" width="5" height="3" fill="#53362b"/></g>
  <g id="front"><use href="#body"/><use href="#hair"/><rect x="12" y="10" width="8" height="5" fill="#e8b17d"/><rect x="13" y="12" width="2" height="2" fill="#28232c"/><rect x="18" y="12" width="2" height="2" fill="#28232c"/><rect x="15" y="15" width="3" height="1" fill="#70413a"/><rect x="8" y="15" width="3" height="5" fill="#e0aa78"/><rect x="21" y="15" width="3" height="5" fill="#e0aa78"/><rect x="23" y="17" width="2" height="8" fill="#77533a"/><rect x="24" y="15" width="5" height="4" fill="#aeb7bd"/><rect x="25" y="14" width="3" height="2" fill="#e0e4e4"/></g>
  <g id="back"><use href="#body"/><rect x="11" y="13" width="10" height="8" fill="#59634b"/><rect x="12" y="14" width="8" height="5" fill="#79805a"/><rect x="13" y="15" width="6" height="2" fill="#a0a06a"/><use href="#hair"/></g>
  <g id="side"><use href="#body"/><use href="#hair"/><rect x="15" y="10" width="7" height="5" fill="#e8b17d"/><rect x="20" y="12" width="2" height="2" fill="#28232c"/><rect x="8" y="15" width="3" height="5" fill="#e0aa78"/><rect x="22" y="15" width="3" height="6" fill="#e0aa78"/><rect x="24" y="18" width="2" height="7" fill="#77533a"/><rect x="25" y="15" width="4" height="4" fill="#aeb7bd"/></g>
</defs>
<!-- row 1: down, left, right, up -->
<g transform="translate(-0,-0)"><use href="#front"/></g>
<g transform="translate(32,0)"><use href="#side"/><rect x="8" y="15" width="3" height="4" fill="#e0aa78"/></g>
<g transform="translate(64,0)"><use href="#side" transform="translate(32,0) scale(-1,1)"/></g>
<g transform="translate(96,0)"><use href="#back"/></g>
<!-- row 2: alternate walking poses -->
<g transform="translate(0,32)"><use href="#front"/><rect x="10" y="23" width="4" height="4" fill="#6a4331"/><rect x="18" y="24" width="4" height="3" fill="#6a4331"/></g>
<g transform="translate(32,32)"><use href="#side"/><rect x="10" y="23" width="4" height="4" fill="#6a4331"/><rect x="18" y="24" width="5" height="3" fill="#6a4331"/></g>
<g transform="translate(64,32)"><use href="#side" transform="translate(32,0) scale(-1,1)"/><rect x="9" y="24" width="5" height="3" fill="#6a4331"/></g>
<g transform="translate(96,32)"><use href="#back"/><rect x="10" y="23" width="4" height="4" fill="#6a4331"/><rect x="18" y="24" width="4" height="3" fill="#6a4331"/></g>
</svg>